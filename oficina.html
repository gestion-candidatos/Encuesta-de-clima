<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Encuesta de Clima Laboral | Fabric Group</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:#DDDAD0;font-family:'Poppins',Arial,sans-serif;color:#000}
  .tarjeta{background:#fff;border:1px solid #BEA974;border-radius:20px;max-width:520px;width:100%;padding:48px 32px;text-align:center}
  .marca{font-weight:600;letter-spacing:.25em;font-size:13px;color:#BEA974;margin-bottom:28px}
  .linea{width:48px;height:3px;background:#BEA974;margin:0 auto 28px;border-radius:2px}
  h1{font-size:24px;font-weight:600;line-height:1.3;margin-bottom:16px}
  p{font-size:16px;line-height:1.6;color:#666}
</style>
</head>
<body>
  <main class="tarjeta">
    <div class="marca">FABRIC GROUP</div>
    <div class="linea"></div>
    <h1>La encuesta de clima finalizó</h1>
    <p>¡Muchas gracias por participar!</p>
  </main>
</body>
</html>
